[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "printlab-harness"
version = "0.3.1"
license = {text = "PolyForm-Noncommercial-1.0.0"}
authors = [{name = "AFangTeam / 阿方 (Eric)"}]
description = "Local, file-first design and approved-print workflow"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1", "Pillow>=11,<14", "portalocker>=3,<5"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
printlab = "printlab.cli:main"

[tool.setuptools.packages.find]
include = ["printlab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
