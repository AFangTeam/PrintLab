name: Installation or usage problem
description: Share your environment and reproduction steps to help identify a problem.
title: "[Problem] "
body:
  - type: markdown
    attributes:
      value: You may describe the problem in your preferred language. Remove private information before submitting.
  - type: input
    id: version
    attributes:
      label: PrintLab version
      description: Release tag or commit; installed from ZIP or Git.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Python/Node and agent host. For printing, include printer model, firmware, Studio version, nozzle and material. Do not include access codes, API keys, serial numbers or private network addresses.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps and results
      description: Where you started, commands/actions, expected result and actual result. Include redacted errors or screenshots.
    validations:
      required: true
  - type: textarea
    id: dispatch
    attributes:
      label: Have you already attempted to send the print?
      description: If relevant, state not sent, sent once, or outcome unknown. Reconcile an unknown outcome before trying again; do not repeatedly press Send.
